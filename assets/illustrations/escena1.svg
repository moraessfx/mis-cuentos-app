<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luna mirando por la ventana una luz que cae del cielo">
  <defs>
    <linearGradient id="skyCover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#233a63"/>
      <stop offset="100%" stop-color="#12203a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#skyCover)"/>
  <circle cx="335" cy="55" r="30" fill="#FBF3E7" opacity="0.95"/>
  <circle cx="325" cy="45" r="30" fill="#12203a"/>
  <g fill="#F5B942">
    <circle cx="60" cy="40" r="2.4"/>
    <circle cx="110" cy="70" r="1.8"/>
    <circle cx="160" cy="35" r="2"/>
    <circle cx="250" cy="30" r="1.6"/>
    <circle cx="30" cy="100" r="1.8"/>
    <circle cx="200" cy="60" r="1.4"/>
  </g>
  <!-- casa / marco de ventana -->
  <rect x="0" y="150" width="400" height="150" fill="#0d1830"/>
  <rect x="120" y="90" width="160" height="130" rx="10" fill="#2b3f68" stroke="#F5B942" stroke-width="4"/>
  <rect x="120" y="90" width="160" height="130" rx="10" fill="none" stroke="#F5B942" stroke-width="4"/>
  <line x1="200" y1="90" x2="200" y2="220" stroke="#F5B942" stroke-width="4"/>
  <line x1="120" y1="155" x2="280" y2="155" stroke="#F5B942" stroke-width="4"/>
  <!-- estrella cayendo con estela -->
  <path d="M330 40 L210 150" stroke="#F5B942" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <g transform="translate(210,150)">
    <path d="M0,-10 L3,-3 L10,0 L3,3 L0,10 L-3,3 L-10,0 L-3,-3 Z" fill="#F5B942"/>
  </g>
  <!-- Luna la niña, silueta en la ventana -->
  <g transform="translate(200,205)">
    <path d="M-22,0 L-22,-15 Q-22,-40 0,-40 Q22,-40 22,-15 L22,0 Z" fill="#F0806B"/>
    <circle cx="0" cy="-52" r="16" fill="#3b2a4a"/>
    <path d="M-16,-52 Q-16,-70 0,-70 Q16,-70 16,-52 Q16,-60 0,-62 Q-16,-60 -16,-52 Z" fill="#2E2036"/>
    <circle cx="-5" cy="-53" r="1.6" fill="#FBF3E7"/>
    <circle cx="5" cy="-53" r="1.6" fill="#FBF3E7"/>
  </g>
  <rect x="0" y="270" width="400" height="30" fill="#0a1226"/>
</svg>
