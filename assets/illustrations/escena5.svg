<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luna en la colina viendo el pueblo y una línea de luces en el cielo">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#3a2f57"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky5)"/>
  <g fill="#F5B942" opacity="0.9">
    <circle cx="50" cy="35" r="1.8"/>
    <circle cx="120" cy="20" r="1.4"/>
  </g>
  <!-- linea de luces (aurora) -->
  <path d="M40,60 Q150,20 260,55 T380,50" stroke="#F5B942" stroke-width="2.5" fill="none" opacity="0.7" stroke-linecap="round"/>
  <g fill="#F5B942">
    <circle cx="90" cy="45" r="2.4"/>
    <circle cx="150" cy="32" r="2"/>
    <circle cx="220" cy="45" r="2.2"/>
    <circle cx="290" cy="40" r="1.8"/>
  </g>
  <!-- colina -->
  <path d="M0,230 Q200,160 400,230 L400,300 L0,300 Z" fill="#4a3f66"/>
  <!-- pueblo abajo -->
  <g fill="#2a2140">
    <rect x="30" y="255" width="18" height="25"/>
    <rect x="60" y="245" width="16" height="35"/>
    <rect x="90" y="260" width="20" height="20"/>
    <rect x="300" y="250" width="18" height="30"/>
    <rect x="330" y="260" width="16" height="20"/>
  </g>
  <g fill="#F5B942">
    <rect x="35" y="262" width="4" height="4"/>
    <rect x="65" y="255" width="4" height="4"/>
    <rect x="305" y="258" width="4" height="4"/>
  </g>
  <!-- Luna en la cima -->
  <g transform="translate(200,205)">
    <path d="M-18,10 Q-18,-22 0,-22 Q18,-22 18,10 Z" fill="#F0806B"/>
    <circle cx="0" cy="-32" r="14" fill="#3b2a4a"/>
    <path d="M-14,-32 Q-14,-48 0,-48 Q14,-48 14,-32 Q14,-38 0,-40 Q-14,-38 -14,-32 Z" fill="#2E2036"/>
    <circle cx="-4" cy="-33" r="1.4" fill="#FBF3E7"/>
    <circle cx="4" cy="-33" r="1.4" fill="#FBF3E7"/>
    <!-- estrella brillando fuerte en su mano -->
    <path d="M20,0 L26,8 L36,10 L26,14 L20,24 L14,14 L4,10 L14,8 Z" fill="#F5B942"/>
    <circle cx="20" cy="10" r="18" fill="#F5B942" opacity="0.2"/>
  </g>
</svg>
