<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luna encuentra una pequeña estrella temblorosa junto a un árbol en el jardín">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#233a63"/>
      <stop offset="60%" stop-color="#1B2A4A"/>
      <stop offset="100%" stop-color="#2f4a3a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky2)"/>
  <circle cx="60" cy="45" r="22" fill="#FBF3E7" opacity="0.9"/>
  <g fill="#F5B942">
    <circle cx="150" cy="30" r="2"/>
    <circle cx="250" cy="50" r="1.6"/>
    <circle cx="330" cy="30" r="2.2"/>
    <circle cx="300" cy="80" r="1.4"/>
  </g>
  <rect x="0" y="210" width="400" height="90" fill="#345c42"/>
  <!-- arbol -->
  <rect x="300" y="150" width="18" height="80" fill="#5a3d2b"/>
  <ellipse cx="309" cy="140" rx="55" ry="45" fill="#3f6b4a"/>
  <ellipse cx="280" cy="160" rx="35" ry="30" fill="#4a7a55"/>
  <!-- Luna agachada -->
  <g transform="translate(150,225)">
    <path d="M-20,10 Q-20,-25 0,-25 Q20,-25 20,10 Z" fill="#F0806B"/>
    <circle cx="0" cy="-35" r="15" fill="#3b2a4a"/>
    <path d="M-15,-35 Q-15,-52 0,-52 Q15,-52 15,-35 Q15,-42 0,-44 Q-15,-42 -15,-35 Z" fill="#2E2036"/>
    <circle cx="-5" cy="-36" r="1.5" fill="#FBF3E7"/>
    <circle cx="5" cy="-36" r="1.5" fill="#FBF3E7"/>
  </g>
  <!-- estrellita temblorosa con carita -->
  <g transform="translate(215,235)">
    <path d="M0,-16 L5,-5 L17,0 L5,5 L0,16 L-5,5 L-17,0 L-5,-5 Z" fill="#F5B942"/>
    <circle cx="-4" cy="-1" r="1.4" fill="#2E2036"/>
    <circle cx="4" cy="-1" r="1.4" fill="#2E2036"/>
    <path d="M-3,4 Q0,6 3,4" stroke="#2E2036" stroke-width="1" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="24" fill="#F5B942" opacity="0.18"/>
  </g>
</svg>
