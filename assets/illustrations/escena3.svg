<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Luna en su cama escucha un ruido en la ventana">
  <rect width="400" height="300" fill="#241b38"/>
  <rect x="0" y="0" width="400" height="300" fill="#2c2246"/>
  <rect x="270" y="40" width="100" height="120" rx="8" fill="#3a2d5c" stroke="#B9A6DD" stroke-width="4"/>
  <line x1="320" y1="40" x2="320" y2="160" stroke="#B9A6DD" stroke-width="3"/>
  <line x1="270" y1="100" x2="370" y2="100" stroke="#B9A6DD" stroke-width="3"/>
  <g fill="#F5B942">
    <circle cx="60" cy="40" r="2"/>
    <circle cx="120" cy="70" r="1.6"/>
    <circle cx="200" cy="35" r="1.8"/>
  </g>
  <!-- ondas de sonido toc toc -->
  <g stroke="#F5B942" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M240,90 q-15,10 0,20"/>
    <path d="M230,80 q-28,20 0,40"/>
  </g>
  <!-- cama -->
  <rect x="60" y="210" width="180" height="14" rx="6" fill="#5a3d2b"/>
  <rect x="60" y="170" width="180" height="45" rx="14" fill="#B9A6DD"/>
  <rect x="70" y="160" width="50" height="30" rx="10" fill="#FBF3E7"/>
  <!-- Luna sentada, ojos abiertos -->
  <g transform="translate(160,178)">
    <ellipse cx="0" cy="5" rx="45" ry="14" fill="#F0806B"/>
    <circle cx="-25" cy="-8" r="13" fill="#3b2a4a"/>
    <path d="M-38,-8 Q-38,-24 -25,-24 Q-12,-24 -12,-8 Q-12,-14 -25,-16 Q-38,-14 -38,-8 Z" fill="#2E2036"/>
    <circle cx="-29" cy="-9" r="1.6" fill="#FBF3E7"/>
    <circle cx="-21" cy="-9" r="1.6" fill="#FBF3E7"/>
  </g>
</svg>
